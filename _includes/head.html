<head>
  <meta charset="UTF-8">
  <meta http-equiv="content-language" content="en">
  <meta http-equiv="content-type" content="text/html; charset=UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="theme-color" content="#f2f6f9">

  <title>{{ site.name }}{% if page.title and page.url != "/" %} | {{ page.title }}{% endif %}</title>
  <meta name="description" content="{{ site.description | strip_newlines | strip }}">

  <meta property="og:title" content="{{ site.title }} — {{ site.course_number }}, {{ site.course_term }}">
  <meta property="og:description" content="{{ site.description | strip_newlines | strip }}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{ page.url | absolute_url }}">

  <link rel="shortcut icon" href="{{ '/assets/img/favicon.ico' | relative_url }}">

  <!-- Type: Fraunces (display), Manrope (body), JetBrains Mono (metadata) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">

  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  <link rel="canonical" href="{{ page.url | replace:'index.html','' | relative_url }}">

  <!-- Restore the saved theme before first paint so dark mode never flashes. -->
  <script>
    (function () {
      try {
        if (localStorage.getItem('theme') === 'dark') {
          document.documentElement.classList.add('dark-mode-preload');
        }
      } catch (e) {}
    })();
  </script>

  {% if site.enable_latexjs %}
  <!-- Load Latex JS -->
  <script src="https://cdn.jsdelivr.net/npm/latex.js@{{ site.latexjs_version }}/dist/latex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/latex.js@{{ site.latexjs_version }}/dist/latex.component.js"></script>
  {% endif %}
</head>
