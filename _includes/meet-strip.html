<div class="meet-strip" role="group" aria-label="Class meeting details">
  <div class="meet-strip__cell">
    <span class="meet-strip__label">When</span>
    <span class="meet-strip__value">{{ site.meeting_days }}</span>
    <span class="meet-strip__hint">{{ site.meeting_time }}</span>
  </div>
  <div class="meet-strip__cell">
    <span class="meet-strip__label">Where</span>
    <span class="meet-strip__value">{{ site.meeting_room }}</span>
    <span class="meet-strip__hint">{{ site.meeting_building }}</span>
  </div>
  <div class="meet-strip__cell">
    <span class="meet-strip__label">Remote</span>
    <span class="meet-strip__value"><a href="{{ site.zoom_url }}" target="_blank" rel="noopener">Zoom</a></span>
    <span class="meet-strip__hint"><a href="{{ site.zoom_url }}" target="_blank" rel="noopener">cmu.zoom.us/j/97661004908</a></span>
  </div>
</div>
